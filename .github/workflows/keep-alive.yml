name: Keep Alive - Ping Render Health

on:
  # schedule:
    # Render free tier spins down after 15 min of inactivity.
    # Ping every 14 minutes to keep the server awake.
    # - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging PayGate Render backend at $(date)..."
          RESPONSE=$(curl -sS --max-time 60 --retry 3 --retry-delay 5 https://stripe-backend-1-12ie.onrender.com/health)
          echo "Response: $RESPONSE"
